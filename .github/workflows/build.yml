name: Build

on:
  workflow_dispatch:
  push:
    branches: [master, workflow]
  pull_request:
    branches: [master, workflow]

env:
  CARGO_TERM_COLOR: always
  ONDK_VERSION: "r29.5"

jobs:
  build:
    name: Build (${{ matrix.profile }}, ${{ matrix.mode.name }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        profile: [debug, release]
        mode:
          - name: standalone
            feature: "zynx/standalone"
          - name: module
            feature: ""
          - name: module-zygisk
            feature: "zynx/zygisk"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Setup Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Rust (nightly for eBPF)
        run: rustup toolchain install nightly --component rust-src

      - name: Setup ONDK
        run: python3 scripts/setup-ondk.py --version $ONDK_VERSION

      - name: Setup cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.26.1

      - name: Install bpf-linker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall bpf-linker --no-confirm

      - name: Build standalone
        if: ${{ matrix.mode.name == 'standalone' }}
        run: just build ${{ matrix.profile }} "${{ matrix.mode.feature }}" false

      - name: Package module
        if: ${{ matrix.mode.name != 'standalone' }}
        run: just package-module ${{ matrix.profile }} "${{ matrix.mode.feature }}"

      - name: Upload standalone artifact
        if: ${{ matrix.mode.name == 'standalone' }}
        uses: actions/upload-artifact@v7
        with:
          name: zynx-${{ matrix.profile }}-${{ matrix.mode.name }}
          path: |
            target/aarch64-linux-android/${{ matrix.profile }}/zynx
            target/aarch64-linux-android/${{ matrix.profile }}/zynx.dwp
            target/aarch64-linux-android/${{ matrix.profile }}/libzynx_bridge.so.dwp

      - name: Upload module artifact
        if: ${{ matrix.mode.name != 'standalone' }}
        uses: actions/upload-artifact@v7
        with:
          name: zynx-${{ matrix.profile }}-${{ matrix.mode.name }}
          path: |
            target/module-${{ matrix.profile }}.zip
            target/aarch64-linux-android/${{ matrix.profile }}/zynx.dwp
            target/aarch64-linux-android/${{ matrix.profile }}/libzynx_bridge.so.dwp
